<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel rozhodčího – IS FAČR</title>
<script>
  const role = localStorage.getItem('facr-role');
  if (role !== 'referee') {
    window.location.href = role === 'club' ? 'dashboard.html' : 'login.html';
  }
</script>
<link rel="stylesheet" href="css/styles.css">
<style>
  .table-wrapper { overflow-x: auto; background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(20,24,43,.12); margin-bottom: 24px; }
  .data-table { width: 100%; border-collapse: collapse; min-width: 600px; }
  .data-table th, .data-table td { padding: 16px; text-align: left; border-bottom: 1px solid var(--line); }
  .data-table th { background: #f8f9fc; color: var(--muted); font-weight: 600; font-size: 0.9rem; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover { background: var(--surface); }
  .badge-link { display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 16px; border-radius: 20px; min-height: 36px; }
  .badge-link:hover { opacity: 0.9; }

  .search-result-card { display: flex; gap: 20px; align-items: center; background: var(--card); padding: 24px; border-radius: var(--radius); box-shadow: 0 4px 12px rgba(20,24,43,0.1); border: 1px solid var(--line); margin-top: 16px; }
  .sr-avatar { width: 80px; height: 80px; background: var(--surface); border-radius: 12px; display: grid; place-items: center; font-size: 2rem; color: var(--primary); font-weight: 700; border: 2px solid var(--line); flex-shrink: 0; }
  .sr-info p { margin: 4px 0; font-size: 0.95rem; }
</style>
</head>
<body>

<div class="layout">
  <nav class="side" aria-label="Hlavní navigace">
    <a href="portal.html" class="brand" style="display: block; padding: 0; min-height: auto; border-radius: 0; background: transparent; text-decoration: none;">FAČR <span>informační systém</span></a>
    <a href="referee.html" aria-current="page">Moje delegace</a>
    <a href="public-league.html">Soutěže a tabulky</a>
    <a href="public-players.html">Databáze hráčů</a>
    <a href="portal.html">Veřejný portál</a>
    <button type="button" class="link-btn" onclick="resetAllMatches()">Resetovat všechny zápisy</button>
    
    <div style="margin-top: auto; padding: 16px; background: rgba(0,0,0,0.15); border-radius: 12px;">
      <div style="font-size: 0.85rem; opacity: 0.8; margin-bottom: 2px;">Přihlášen jako:</div>
      <div id="ref-sidebar-name" style="font-weight: 600; margin-bottom: 16px;">Rozhodčí</div>
      <a href="login.html" onclick="localStorage.removeItem('facr-role'); localStorage.removeItem('facr-user-id');" style="display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; text-decoration: none; min-height: 36px; font-weight: 500; font-size: 0.9rem;">
        Odhlásit se
      </a>
    </div>
  </nav>

  <main class="main">
    <header class="head">
      <div>
        <p class="muted">Osobní profil rozhodčího</p>
        <h1 id="title">Načítání...</h1>
      </div>
    </header>

    <!-- Ověření totožnosti hráče -->
    <section aria-labelledby="search-h" style="margin-bottom: 32px;">
      <h2 id="search-h" style="margin-bottom: 16px;">Ověření totožnosti hráče před utkáním</h2>
      <form id="ref-search-form" style="display: flex; gap: 12px; background: var(--card); padding: 20px; border-radius: var(--radius); box-shadow: 0 1px 3px rgba(20,24,43,.12);">
        <input type="text" id="ref-search-input" placeholder="Zadejte ID nebo příjmení hráče (např. 'Adámek')..." style="flex: 1; min-height: var(--target); padding: 0 16px; font: inherit; border: 1px solid var(--line); border-radius: 12px;" required>
        <button type="submit" class="btn">Ověřit v registru</button>
      </form>
      <div id="ref-search-result"></div>
    </section>

    <!-- Tabulka delegací -->
    <section aria-labelledby="utkani-h">
      <h2 id="utkani-h" style="margin-bottom: 16px;">Moje delegace (Přiřazená utkání)</h2>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Datum a čas</th>
              <th>Zápas</th>
              <th>Soutěž / Kolo</th>
              <th>Role</th>
              <th>Akce</th>
            </tr>
          </thead>
          <tbody id="delegations-body">
            <!-- Vygenerováno podle přihlášeného rozhodčího -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="js/db.js"></script>
<script>
  // 1. Načtení profilu a delegací přihlášeného rozhodčího
  const currentUser = getCurrentUser();
  if (currentUser) {
    document.getElementById('title').textContent = currentUser.name.replace(' (Rozhodčí)', '');
    document.getElementById('ref-sidebar-name').textContent = currentUser.name;

    const myMatches = db.matches.filter(m => m.refereeId === currentUser.id);
    const tbody = document.getElementById('delegations-body');

    if (myMatches.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="muted">Nemáte přiřazeny žádné delegace.</td></tr>';
    } else {
      tbody.innerHTML = myMatches.map(m => {
        const isPlayed = m.status === 'played';
        const actionBtn = isPlayed
          ? `<a href="public-match.html?id=${m.id}" class="btn outline small" style="min-height: 36px; padding: 0 16px; display: inline-flex; align-items: center;">Uzavřeno (Detail)</a>`
          : `<a href="index.html?id=${m.id}" class="badge-link">Otevřít zápis</a>`;

        return `
          <tr>
            <td><strong>${m.date}</strong></td>
            <td>${getClubName(m.homeId)} – ${getClubName(m.awayId)}</td>
            <td class="muted">${db.league.name}<br>${m.round}. kolo</td>
            <td><span class="chip" style="font-weight: 700;">Hlavní rozhodčí</span></td>
            <td>${actionBtn}</td>
          </tr>
        `;
      }).join('');
    }
  }

  // 2. Ověření totožnosti hráče
  document.getElementById('ref-search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const query = document.getElementById('ref-search-input').value.trim().toLowerCase();
    const resultBox = document.getElementById('ref-search-result');
    
    const player = db.players.find(p => p.name.toLowerCase().includes(query) || p.id === query);
    
    if (player) {
      const initials = player.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      const clubName = getClubName(player.clubId);
      
      resultBox.innerHTML = `
        <div class="search-result-card">
          <div class="sr-avatar">${initials}</div>
          <div class="sr-info">
            <h3 style="margin: 0 0 8px; font-size: 1.25rem;">${player.name}</h3>
            <p><span class="muted">ID člena:</span> <strong>${player.id}</strong></p>
            <p><span class="muted">Klub:</span> ${clubName}</p>
            <p><span class="muted">Ročník:</span> ${player.year}</p>
            <p style="margin-top: 8px;"><span class="chip ok">Fotografie platná (Ověřeno)</span> <span class="chip ok">Aktivní členství</span></p>
          </div>
        </div>
      `;
    } else {
      resultBox.innerHTML = `
        <div style="padding: 20px; background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); margin-top: 16px; font-weight: 500;">
          Hráč nebyl v registrech FAČR nalezen. Zkontrolujte prosím zadání.
        </div>
      `;
    }
  });
</script>
</body>
</html>
